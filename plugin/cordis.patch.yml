# @ttmouse/dsh-taskboard bundle patch: inserts the dual-face plugin row into
# the web profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field) over dsh-base; activate with
# `dsh plugin --profile web add link:<this-directory>` plus adding
# `@ttmouse/dsh-taskboard` to `dsh.profile.bundles` in the profile
# package.json.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (starts the taskboard SQLite server and proxies it at
# /dsh-taskboard/* on the shared webserver), and the `dsh.client` declaration
# in package.json makes the browser half (exports "./client", served at
# /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: @ttmouse/dsh-taskboard
      name: '@ttmouse/dsh-taskboard'
